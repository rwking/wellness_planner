<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Duration (Last 30 Days)</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #fafafa; }
    h2   { color: #333; margin-bottom: 1rem; }
    #chart svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h2>Sleep Duration (Last 30 Days)</h2>
  <div id="chart"></div>
  <script>
    const data = [{"date": "2026-01-20", "total_hours": 6.2}, {"date": "2026-01-21", "total_hours": 5.8}, {"date": "2026-01-22", "total_hours": 6.6}, {"date": "2026-01-23", "total_hours": 7.0}, {"date": "2026-01-24", "total_hours": 7.8}, {"date": "2026-01-25", "total_hours": 8.1}, {"date": "2026-01-26", "total_hours": 8.5}, {"date": "2026-01-27", "total_hours": 5.8}, {"date": "2026-01-28", "total_hours": 8.7}, {"date": "2026-01-29", "total_hours": 7.0}, {"date": "2026-01-30", "total_hours": 7.0}, {"date": "2026-01-31", "total_hours": 7.8}, {"date": "2026-02-01", "total_hours": 7.7}, {"date": "2026-02-02", "total_hours": 7.9}, {"date": "2026-02-03", "total_hours": 6.0}, {"date": "2026-02-04", "total_hours": 5.4}, {"date": "2026-02-05", "total_hours": 8.9}, {"date": "2026-02-06", "total_hours": 7.4}, {"date": "2026-02-07", "total_hours": 8.9}, {"date": "2026-02-08", "total_hours": 6.3}, {"date": "2026-02-09", "total_hours": 7.1}, {"date": "2026-02-10", "total_hours": 6.9}, {"date": "2026-02-11", "total_hours": 7.5}, {"date": "2026-02-12", "total_hours": 7.9}, {"date": "2026-02-13", "total_hours": 8.8}, {"date": "2026-02-14", "total_hours": 7.3}, {"date": "2026-02-15", "total_hours": 5.5}, {"date": "2026-02-16", "total_hours": 5.9}, {"date": "2026-02-17", "total_hours": 8.5}, {"date": "2026-02-18", "total_hours": 6.1}];

    const plot = Plot.plot({
      marginLeft: 60,
      marginBottom: 50,
      x: { label: "Date", tickRotate: -30 },
      y: { label: "Total Hours", grid: true },
      marks: [
        Plot.line(data, { x: "date", y: "total_hours", stroke: "#4f7be8", strokeWidth: 2 }),
        Plot.ruleY([0])
      ]
    });

    document.getElementById("chart").appendChild(plot);
  </script>
</body>
</html>
